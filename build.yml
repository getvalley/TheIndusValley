name: Build Valley APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Valley V26 project
        run: |
          test -f Valley-v26-with-index-html.zip
          unzip -q Valley-v26-with-index-html.zip -d .
          test -f Valley-v15/settings.gradle
          test -f Valley-v15/app/build.gradle
          test -f Valley-v15/app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon -p Valley-v15 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: valley-v26-debug-apk
          path: Valley-v15/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
